site_name: PandaDock Documentation
site_description: Next-Generation Molecular Docking with Sub-Angstrom Precision
site_author: Pritam Kumar Panda
site_url: https://pandadock.readthedocs.io/

repo_name: pritampanda15/PandaDock
repo_url: https://github.com/pritampanda15/PandaDock
edit_uri: edit/latest-v3.0/docs/

copyright: Copyright &copy; 2024 Pritam Kumar Panda

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - toc.follow
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
  language: en
  icon:
    repo: fontawesome/brands/github
  logo: pandadock_logo_new.png
  favicon: favicon.png

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/pritampanda15/PandaDock
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/pandadock/
  analytics:
    provider: google
    property: !ENV GOOGLE_ANALYTICS_KEY

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - minify:
      minify_html: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: pritampanda15
      repo: PandaDock
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started.md
      - Quick Start: tutorials/quickstart.md
      - Basic Docking: tutorials/basic-docking.md
  - Algorithms:
      - Overview: algorithms/index.md
      - CPU Algorithms:
          - Enhanced Hierarchical: algorithms/enhanced-hierarchical-cpu.md
          - Monte Carlo: algorithms/monte-carlo-cpu.md
          - Genetic Algorithm: algorithms/genetic-algorithm-cpu.md
          - Hierarchical: algorithms/hierarchical-cpu.md
          - Crystal Guided: algorithms/crystal-guided-cpu.md
      - GPU Algorithms:
          - Enhanced Hierarchical GPU: algorithms/enhanced-hierarchical-gpu.md
          - CUDA Monte Carlo: algorithms/cuda-monte-carlo.md
          - CUDA Genetic Algorithm: algorithms/cuda-genetic-algorithm.md
      - Specialized Modes:
          - Flexible Docking: algorithms/flexible-docking.md
          - Metal Docking: algorithms/metal-docking.md
          - ML-Enhanced Docking: algorithms/ml-docking.md
          - Tethered Docking: algorithms/tethered-docking.md
  - Scoring Functions:
      - Overview: scoring/index.md
      - Physics-Based: scoring/physics-based.md
      - Empirical: scoring/empirical.md
      - Precision Score: scoring/precision-score.md
      - Hybrid: scoring/hybrid.md
      - GPU Scoring: scoring/gpu-scoring.md
  - Command Line Interface:
      - Overview: cli/index.md
      - pandadock: cli/pandadock.md
      - pandadock-flex: cli/pandadock-flex.md
      - pandadock-metal: cli/pandadock-metal.md
      - pandadock-ml: cli/pandadock-ml.md
      - pandadock-tethered: cli/pandadock-tethered.md
      - pandadock-report: cli/pandadock-report.md
  - Tutorials:
      - Overview: tutorials/index.md
      - Basic Docking: tutorials/basic-docking.md
      - High-Accuracy Docking: tutorials/high-accuracy.md
      - GPU Acceleration: tutorials/gpu-acceleration.md
      - Flexible Docking: tutorials/flexible-docking.md
      - Virtual Screening: tutorials/virtual-screening.md
      - Metal Coordination: tutorials/metal-coordination.md
  - User Guide:
      - Best Practices: guide/best-practices.md
      - Performance Optimization: guide/performance.md
      - Troubleshooting: guide/troubleshooting.md
      - FAQ: guide/faq.md
  - API Reference:
      - Overview: api/index.md
      - Docking Module: api/docking.md
      - Scoring Module: api/scoring.md
      - Analysis Module: api/analysis.md
  - Development:
      - Contributing: contributing.md
      - Architecture: development/architecture.md
      - Testing: development/testing.md
  - About:
      - Changelog: changelog.md
      - License: license.md
      - Citation: citation.md
