name: Publish Python Package to PyPI

on:
  # Only "published", not "created". A GitHub release fires both, and with two
  # triggers the second upload hits PyPI's immutable-filename rule and reports
  # the release as failed even though the first upload succeeded.
  release:
    types: [published]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install build tooling
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Check that the tag matches the package version
      # The version is single-sourced from pandadock/__init__.py, so a tag that
      # disagrees with it would publish the wrong version number under the right
      # tag. Fail before anything is uploaded, since PyPI filenames cannot be
      # reused once taken.
      if: github.event_name == 'release'
      run: |
        TAG="${GITHUB_REF_NAME#v}"
        PKG=$(python -c "import re,pathlib; \
          print(re.search(r'__version__\s*=\s*[\"\x27]([^\"\x27]+)', \
          pathlib.Path('pandadock/__init__.py').read_text()).group(1))")
        echo "tag=$TAG package=$PKG"
        if [ "$TAG" != "$PKG" ]; then
          echo "::error::Tag '$GITHUB_REF_NAME' does not match pandadock.__version__ ('$PKG')."
          exit 1
        fi

    - name: Build package
      run: python -m build

    - name: Validate distributions
      # Catches malformed metadata and a README that PyPI would refuse to render.
      run: |
        python -m twine check dist/*
        ls -l dist/

    - name: Publish to Test PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.TEST_PYPI_API_TOKEN }}
        repository-url: https://test.pypi.org/legacy/
        skip-existing: true

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
        skip-existing: true
